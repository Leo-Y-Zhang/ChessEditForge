name: CI

on:
  push:
  pull_request:

jobs:
  # The suite only. Rendering is deliberately absent: a single 1440x2560@60
  # render parks about ten gigabytes and the repository's own house rules allow
  # exactly one render process at a time, which is not a thing to do on a shared
  # runner. Everything here is pure computation over the storyboard and the
  # move list.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # test/fit.test.js measures real text widths, so the native canvas has to
      # install rather than be stubbed. The lockfile carries the linux-x64-gnu
      # prebuild, so this resolves without a compiler.
      - run: npm ci
      - name: Test
        run: npm test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      # The caption-fit checks need Impact, Bahnschrift and Segoe UI, which a
      # Linux runner does not have, so they skip themselves rather than measure
      # in a substituted typeface. That is correct, but a green tick must not be
      # read as "the captions were checked" -- say so in the run summary.
      - name: Say what was not checked
        if: always()
        run: |
          skipped=$(grep -oP '(?<=^. skipped )\d+' test-output.txt | tail -1)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::warning::${skipped} test(s) skipped -- the caption-fit checks need the Windows display fonts and cannot run here. They run on the machine that renders."
          fi

  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
